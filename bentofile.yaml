service: "services.pipeline_service:LicensePlatePipeline"

description: |
  Full license plate recognition pipeline.
  YOLO26n detects plates, Pillow crops them, and Fast-Plate-OCR CCT-S-v2
  recognizes the plate text. The API returns metadata, crops, and an
  annotated original image.

labels:
  project: "license-plate-recognition"
  component: "complete-pipeline"
  stage: "deployment"

models:
  - "license_plate_detector:latest"
  - "license_plate_ocr:latest"

include:
  - "services/"

python:
  packages:
    - "numpy"
    - "Pillow"
    - "torch==2.14.1"
    - "torchvision==0.29.1"
    - "ultralytics"
    - "fast-plate-ocr[onnx]"
    - "onnxruntime"
  lock_packages: true

docker:
  distro: debian
  python_version: "3.13"
  system_packages:
    - libgl1
    - libglib2.0-0
    - libsm6
    - libxext6
    - libxrender1
